# Weekly version updates for every kind of dependency in the repository. Minor and patch
# updates of one ecosystem come in one pull request; major updates come one by one.
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # The base images of the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # The PostgreSQL image of docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
