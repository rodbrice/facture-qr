name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, format, test and end-to-end
    runs-on: ubuntu-latest
    services:
      # An empty database on which the migrations are applied.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Check formatting
        run: dotnet format --no-restore --verify-no-changes

      - name: Apply the migrations to an empty database
        env:
          FACTUREQR_DATABASE: Host=localhost;Database=facture_qr;Username=postgres;Password=postgres
        run: dotnet ef database update --no-build --configuration Release --project src/FactureQr.Persistence

      # The persistence and API tests start their own PostgreSQL with Testcontainers (Docker is available on the runner).
      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the front end and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the front end into the API's wwwroot
        working-directory: web
        run: npm run build

      # The API runs in the Development environment: its appsettings.Development.json holds the
      # synthetic creditor and the connection string of the database migrated above.
      - name: End-to-end test (front end, API and PostgreSQL)
        working-directory: web
        run: npm run e2e

      - name: Keep the recording of the end-to-end run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-recording
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 14

  web:
    name: Front end lint, types, unit tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  compose:
    name: Docker Compose demo
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build and start the demo
        run: docker compose up --build --detach

      # The API applies the migrations and adds the synthetic data before it answers.
      - name: Check the demo answers with the synthetic data
        run: |
          for attempt in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:8080/health && break
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:8080/health
          curl --silent --fail http://127.0.0.1:8080/ | grep --quiet '<div id="root">'
          test "$(curl --silent --fail http://127.0.0.1:8080/invoices | jq length)" -eq 5
          test "$(curl --silent --fail http://127.0.0.1:8080/customers | jq length)" -eq 5

      - name: Show the logs of the demo
        if: ${{ !cancelled() }}
        run: docker compose logs

      - name: Stop the demo
        if: ${{ always() }}
        run: docker compose down --volumes
